<main class="pwcal-page"><header class="pwcal-header"><span class="section-label">Área do Aluno</span><h1>Calendário do Aluno</h1><p>Acompanhe reuniões, provas e eventos da sua turma.</p></header>
<section class="pwcal-panel" aria-label="Calendário mensal">
<div class="pwcal-controls"><h2 id="calendarMonth">Calendário</h2><div class="pwcal-buttons">
<button id="previousMonth" aria-label="Mês anterior" type="button"><i class="fa-solid fa-chevron-left"></i></button>
<button id="todayMonth" type="button">Hoje</button>
<button id="nextMonth" aria-label="Próximo mês" type="button"><i class="fa-solid fa-chevron-right"></i></button></div></div>
<div class="pwcal-weekdays" id="weekdays"></div><div class="pwcal-grid" id="calendarGrid" aria-label="Selecione um dia para visualizar os eventos"></div>
</section>
<section class="pwcal-panel pwcal-agenda" aria-label="Lista de eventos"><h2>Eventos e compromissos</h2><p id="calendarStatus" class="pwcal-state" role="status">Carregando eventos...</p><div id="calendarAgenda" class="pwcal-list"></div></section>
