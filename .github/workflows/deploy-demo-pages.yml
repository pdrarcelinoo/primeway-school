name: Publicar demonstração Beta no GitHub Pages

on:
  push:
    branches:
      - feature/acesso-visitante-demo
      - main
    paths:
      - "demo-site/**"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validar arquivos da demonstração
        run: |
          test -s demo-site/index.html
          test -s demo-site/assets/demo-visitante.css
          test -s demo-site/assets/demo-visitante.js
          ! grep -R -nE '<\?php|/api/|PRIMEWAY_DB_' demo-site
      - name: Preparar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar demonstração
        id: deployment
        uses: actions/deploy-pages@v4
