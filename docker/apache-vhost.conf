ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 120
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Garante isolamento das páginas internas também ao acessar URL direta.
    # login.html permanece público; quaisquer outras páginas .html em /pages
    # são autenticadas e autorizadas pela identidade PHP/MySQL.
    RewriteEngine On
    # Página de apresentação pública com metadados institucionais configuráveis.
    RewriteRule ^/escola\.html$ /api/portal/escola.php [END]
    RewriteRule ^/pages/login\.html$ - [END]
    RewriteRule ^/pages/([a-z][a-z0-9_-]*)\.html$ /api/auth/pagina.php [END]
    DirectoryIndex index.html
    LimitRequestBody 25165824

    # Compressão HTTP: reduz transferência de HTML/CSS/JS/JSON sem
    # alterar o conteúdo lógico das respostas nem comprimir fotos.
    <IfModule mod_deflate.c>
        DeflateCompressionLevel 5
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE application/javascript text/javascript
        AddOutputFilterByType DEFLATE application/json application/xml text/xml image/svg+xml
    </IfModule>

    # Somente arquivos estáticos públicos. HTML protegido, fotos pessoais,
    # sessões e APIs preservam suas diretivas privadas/no-store existentes.
    # TTL curto evita servir um JS desatualizado após atualizações do sistema.
    <LocationMatch "^/(?:css|js)/[a-zA-Z0-9_./-]+\\.(?:css|js)$">
        Header set Cache-Control "public, max-age=120, must-revalidate"
    </LocationMatch>
    <LocationMatch "^/img/[a-zA-Z0-9_./-]+\\.(?:png|jpe?g|webp|gif|svg|ico)$">
        Header set Cache-Control "public, max-age=3600, must-revalidate"
    </LocationMatch>

    # Railway termina TLS na borda e documenta X-Forwarded-Proto=https.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS

    <Directory "/var/www/html">
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>
    <LocationMatch "^/(?:config|database|tests|docs|deploy|storage|vendor|node_modules|backups|tmp|logs)(?:/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/(?:.*/)?\.(?!well-known(?:/|$))">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)(?:\.(?:sql|log|ini|conf|yaml|yml|toml|md|bak|dump|pem|key|p12|pfx|example|zip|tar|tgz|7z|gz|bz2|tmp|pid)|composer\.(?:json|lock)|package(?:-lock)?\.json)$">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/(?!api/).+\.php$">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/api/(?:.*/)?_[^/]*\.php$">
        Require all denied
    </LocationMatch>
</VirtualHost>